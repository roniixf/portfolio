<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMBAYARAN - SEO DEV</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        h2 { color: #ff0000; text-shadow: 0 0 10px #ff0000; text-transform: uppercase; margin-bottom: 5px; }
        .price { color: #ffcc00; font-weight: bold; font-size: 22px; margin-bottom: 25px; }

        /* Tombol Pilihan Pembayaran */
        .pay-btn {
            display: block; width: 100%; max-width: 400px; margin: 12px auto;
            padding: 16px; border-radius: 12px; border: none; font-weight: 800;
            cursor: pointer; font-size: 16px; transition: 0.3s; color: #fff;
            text-transform: uppercase;
        }
        .qris { background: linear-gradient(to right, #ffcc00, #ffaa00); color: #000; }
        .dana { background: linear-gradient(to right, #008cff, #005fcc); }
        .ovo  { background: linear-gradient(to right, #9933ff, #6600cc); }
        .back { background: linear-gradient(to right, #00cc66, #00994d); text-decoration: none; margin-top: 20px; }

        /* Box Konten Interaktif */
        .content { 
            display: none; width: 100%; max-width: 400px; margin: 20px auto; 
            padding: 20px; border: 2px solid #ff0000; border-radius: 15px; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); background: #0a0a0a; 
            box-sizing: border-box;
        }
        .content img.logo-pay { width: 120px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        .content img.qris-img { width: 100%; border-radius: 10px; border: 4px solid #fff; }
        .content p { font-size: 16px; margin: 15px 0; font-weight: bold; color: #fff; }

        /* Form Input & Upload */
        .form-group { margin-top: 20px; text-align: left; }
        input[type="text"] { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #ff0000; background: #111; color: #fff; box-sizing: border-box;
        }
        .file-input-wrapper {
            background: #fff; color: #000; padding: 10px; border-radius: 5px;
            margin: 10px 0; display: inline-block; width: 100%; box-sizing: border-box;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-submit { 
            background: linear-gradient(to right, #ffcc00, #ffaa00); color: #000; 
            padding: 15px; border-radius: 10px; font-weight: 900; border: none; 
            cursor: pointer; width: 100%; margin-top: 15px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h2 id="prod-name">MEMUAT PRODUK...</h2>
    <div class="price" id="prod-price">Rp 0</div>

    <button class="pay-btn qris" onclick="showPay('qris-box')">Bayar via QRIS</button>
    <button class="pay-btn dana" onclick="showPay('dana-box')">Bayar via DANA</button>
    <button class="pay-btn ovo"  onclick="showPay('ovo-box')">Bayar via OVO</button>
    <a href="index.html" class="pay-btn back">Kembali ke Produk</a>

    <div id="qris-box" class="content">
        <h3 style="color:#ffcc00; margin-top:0;">INVOICE QRIS</h3>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=SEODEV_QRIS" class="qris-img">
        <p>Silahkan scan QRIS di atas</p>
        <div class="form-area"></div>
    </div>

    <div id="dana-box" class="content">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Logo_danain.svg/1200px-Logo_danain.svg.png" class="logo-pay">
        <p>Nomor DANA: <span style="color:#ffcc00">0881024597294</span></p>
        <div class="form-area"></div>
    </div>

    <div id="ovo-box" class="content">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Logo_ovo_purple.svg/1200px-Logo_ovo_purple.svg.png" class="logo-pay">
        <p>Nomor OVO: <span style="color:#ffcc00">0881024597294</span></p>
        <div class="form-area"></div>
    </div>

    <div id="master-form" style="display:none;">
        <div class="form-group">
            <input type="text" id="user-nama" placeholder="Nama Anda">
            <input type="text" id="user-wa" placeholder="Nomor WhatsApp">
            <div style="margin-top:10px; font-size:13px; color:#ccc;">Pilih File Bukti Transfer:</div>
            <input type="file" id="user-file" class="file-input-wrapper">
            <button class="btn-submit" onclick="kirimKonfirmasi()">Upload Bukti Transfer</button>
        </div>
    </div>

    <script>
        // DATA ASLI SESUAI KODE AWAL LU
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const data = {
            '11': { n: 'TAMPILAN MPO NEW', h: 'Rp 650,000' },
            '10': { n: 'TAMPILAN KINCAI PRO', h: 'Rp 650,000' },
            '9':  { n: 'TAMPILAN NEXUS', h: 'Rp 650,000' },
            '8':  { n: 'TAMPILAN IDN GREEN', h: 'Rp 300,000' },
            '7':  { n: 'TAMPILAN PAY4D', h: 'Rp 400,000' },
            '6':  { n: 'TAMPILAN NUKE', h: 'Rp 550,000' }
        };

        if(data[id]) {
            document.getElementById('prod-name').innerText = data[id].n;
            document.getElementById('prod-price').innerText = data[id].h;
        }

        function showPay(boxId) {
            document.querySelectorAll('.content').forEach(el => el.style.display = 'none');
            const targetBox = document.getElementById(boxId);
            targetBox.style.display = 'block';
            const formHtml = document.getElementById('master-form').innerHTML;
            targetBox.querySelector('.form-area').innerHTML = formHtml;
        }

        function kirimKonfirmasi() {
            const nama = document.getElementById('user-nama').value;
            const produk = document.getElementById('prod-name').innerText;
            if(!nama) { alert('Isi nama dulu bos!'); return; }
            const waLink = "https://wa.me/628385080976?text=" + encodeURIComponent(
                "Konfirmasi Pembayaran\nNama: " + nama + "\nProduk: " + produk
            );
            window.location.href = waLink;
        }
    </script>
</body>
</html>
