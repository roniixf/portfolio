<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PEMBAYARAN - SEO DEV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .pay-container {
    width: 90%;
    max-width: 400px;
    background: #080808;
    border: 2px solid #ff0000;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
  }
  h2 { color: #ff0000; text-shadow: 0 0 10px #ff0000; margin-top: 0; }
  .detail-box {
    background: #111;
    border: 1px dashed #ff0000;
    padding: 15px;
    border-radius: 10px;
    margin: 20px 0;
    text-align: left;
  }
  .detail-box p { margin: 5px 0; font-size: 14px; }
  .detail-box b { color: #ff0000; }
  
  .qris-box img {
    width: 100%;
    border-radius: 10px;
    border: 5px solid #fff; /* QRIS biasanya background putih biar scan lancar */
    margin: 10px 0;
  }
  
  .btn-confirm {
    display: block;
    background: linear-gradient(to right, #b30000, #ff0000);
    color: #fff;
    padding: 15px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 20px;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
  }
  .timer { font-size: 12px; color: #888; margin-top: 10px; }
</style>
</head>
<body>

<div class="pay-container">
  <h2>CHECKOUT PEMBAYARAN</h2>
  
  <div class="detail-box">
    <p>Produk: <b id="prod-name">Memuat...</b></p>
    <p>Total Tagihan: <b id="prod-price">Memuat...</b></p>
    <p>Metode: <b>QRIS ALL PAYMENT</b></p>
  </div>

  <div class="qris-box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=CONTOH_QRIS_LU" alt="QRIS">
    <p style="font-size: 11px; color: #aaa;">Scan QRIS di atas untuk menyelesaikan pembayaran</p>
  </div>

  <a id="wa-confirm" href="#" class="btn-confirm">Konfirmasi Pembayaran</a>
  <p class="timer">Selesaikan pembayaran dalam <span id="time">05:00</span></p>
</div>

<script>
  // Script untuk ambil ID produk dari URL
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');

  // Database sederhana biar otomatis sesuai ID
  const dataProduk = {
    '11': { nama: 'TAMPILAN MPO NEW', harga: 'Rp 650,000' },
    '10': { nama: 'TAMPILAN KINCAI PRO', harga: 'Rp 650,000' },
    '9': { nama: 'TAMPILAN NEXUS', harga: 'Rp 650,000' },
    '8': { nama: 'TAMPILAN IDN GREEN', harga: 'Rp 300,000' },
    '7': { nama: 'TAMPILAN PAY4D', harga: 'Rp 400,000' },
    '6': { nama: 'TAMPILAN NUKE', harga: 'Rp 550,000' }
  };

  if (dataProduk[id]) {
    document.getElementById('prod-name').innerText = dataProduk[id].nama;
    document.getElementById('prod-price').innerText = dataProduk[id].harga;
    
    // Link WA Konfirmasi Otomatis
    const waLink = "https://wa.me/628385080976?text=" + encodeURIComponent(
      "Halo Admin, saya ingin konfirmasi pembayaran.\n\n" +
      "Produk: " + dataProduk[id].nama + "\n" +
      "Harga: " + dataProduk[id].harga + "\n" +
      "Metode: QRIS\n\nMohon segera diproses."
    );
    document.getElementById('wa-confirm').href = waLink;
  }

  // Timer Hitung Mundur Sederhana
  function startTimer(duration, display) {
    var timer = duration, minutes, seconds;
    setInterval(function () {
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);
      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;
      display.textContent = minutes + ":" + seconds;
      if (--timer < 0) { timer = duration; }
    }, 1000);
  }
  window.onload = function () {
    startTimer(300, document.querySelector('#time'));
  };
</script>

</body>
</html>
