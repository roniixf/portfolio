<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMBAYARAN - SEO DEV</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        
        /* HEADER MERAH NEON CERAH */
        h2 { color: #ff0000; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; text-transform: uppercase; margin-top: 10px; }
        .price { color: #fff; font-weight: bold; font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #ff0000; display: inline-block; padding-bottom: 5px; text-shadow: 0 0 10px #ff0000; }

        /* TOMBOL MENU MERAH NEON NYALA */
        .pay-btn {
            display: block; width: 100%; max-width: 400px; margin: 12px auto;
            padding: 16px; border-radius: 12px; border: 2px solid #ff0000; 
            font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; 
            color: #fff; text-transform: uppercase;
            background: #000;
            box-shadow: 0 0 15px #ff0000;
        }
        .pay-btn:hover { box-shadow: 0 0 30px #ff0000; background: #220000; transform: scale(1.02); }
        .back { background: #111; border: 1px solid #444; margin-top: 20px; font-size: 14px; text-decoration: none; box-shadow: none; opacity: 0.8; }

        /* BOX KONTEN INTERAKTIF */
        .content { 
            display: none; width: 100%; max-width: 400px; margin: 20px auto; 
            padding: 20px; border: 2px solid #ff0000; border-radius: 15px; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8); background: #080808; 
            box-sizing: border-box;
            animation: neonPulse 1.5s infinite alternate;
        }
        @keyframes neonPulse { from { box-shadow: 0 0 20px #ff0000; } to { box-shadow: 0 0 40px #ff0000; } }

        /* LOGO FIX MENGGUNAKAN LINK BARU */
        .logo-pay { width: 180px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        .qris-img { width: 100%; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 0 20px #ff0000; }
        .acc-number { font-size: 28px; color: #ff0000; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 15px #ff0000; margin: 10px 0; }

        /* AREA UPLOAD BUKTI */
        .upload-section {
            width: 100%; max-width: 400px; margin: 30px auto; 
            padding: 20px; border: 2px dashed #ff0000; border-radius: 15px;
            background: #0a0a0a; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
        .upload-section h3 { color: #ff0000; margin-top: 0; font-size: 18px; text-transform: uppercase; text-shadow: 0 0 10px #ff0000; }
        
        input[type="text"] { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #ff0000; background: #000; color: #fff; box-sizing: border-box;
        }
        input[type="file"] {
            width: 100%; background: #fff; color: #000; padding: 10px; border-radius: 8px;
            margin: 10px 0; cursor: pointer; font-weight: bold;
        }

        .btn-submit { 
            background: #ff0000; color: #fff; padding: 18px; border-radius: 50px; 
            font-weight: 900; border: none; cursor: pointer; width: 100%; 
            margin-top: 15px; text-transform: uppercase; 
            box-shadow: 0 0 25px #ff0000;
            transition: 0.3s;
        }
        .btn-submit:hover { box-shadow: 0 0 40px #ff0000; background: #ff3333; }
    </style>
</head>
<body>

    <h2 id="prod-name">MEMUAT...</h2>
    <div class="price" id="prod-price">Rp 0</div>

    <button class="pay-btn" onclick="showPay('qris-box')">Bayar via QRIS</button>
    <button class="pay-btn" onclick="showPay('dana-box')">Bayar via DANA</button>
    <button class="pay-btn" onclick="showPay('ovo-box')">Bayar via OVO</button>

    <div id="qris-box" class="content">
        <h3 style="color:#ff0000; margin-top:0; text-shadow: 0 0 10px #ff0000;">SCAN QRIS</h3>
        <img src="https://takenupload.com/696782a493356" class="qris-img">
        <p style="font-weight: bold;">Silahkan scan kode QR di atas</p>
    </div>

    <div id="dana-box" class="content">
        <img src="https://takenupload.com/696784de4f74d" class="logo-pay" alt="DANA">
        <p style="font-weight: bold;">TRANSFER DANA KE:</p>
        <div class="acc-number">082245390572</div>
        <p style="font-size: 13px; color: #ffcccc;">Pastikan nomor sudah benar sebelum transfer</p>
    </div>

    <div id="ovo-box" class="content">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Logo_ovo_purple.svg/512px-Logo_ovo_purple.svg.png" class="logo-pay" alt="OVO">
        <p style="font-weight: bold;">TRANSFER OVO KE:</p>
        <div class="acc-number">08385080976</div>
        <p style="font-size: 13px; color: #ffcccc;">Pastikan nomor sudah benar sebelum transfer</p>
    </div>

    <div class="upload-section">
        <h3>UPLOAD BUKTI TRANSFER</h3>
        <input type="text" id="user-nama" placeholder="Masukan Nama Anda">
        <input type="text" id="user-wa" placeholder="Masukan Nomor WhatsApp">
        <input type="file" id="user-file">
        <button class="btn-submit" onclick="kirimKonfirmasi()">Kirim Bukti Pembayaran</button>
    </div>

    <a href="index.html" class="pay-btn back">Kembali ke Produk</a>

    <script>
        // DATA PRODUK OTOMATIS
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const data = {
            '11': { n: 'TAMPILAN MPO NEW', h: 'Rp 650,000' },
            '10': { n: 'TAMPILAN KINCAI PRO', h: 'Rp 650,000' },
            '9':  { n: 'TAMPILAN NEXUS', h: 'Rp 650,000' },
            '8':  { n: 'TAMPILAN IDN GREEN', h: 'Rp 300,000' },
            '7':  { n: 'TAMPILAN PAY4D', h: 'Rp 400,000' },
            '6':  { n: 'TAMPILAN NUKE', h: 'Rp 550,000' }
        };

        if(data[id]) {
            document.getElementById('prod-name').innerText = data[id].n;
            document.getElementById('prod-price').innerText = data[id].h;
        }

        function showPay(boxId) {
            document.querySelectorAll('.content').forEach(el => el.style.display = 'none');
            const target = document.getElementById(boxId);
            target.style.display = 'block';
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function kirimKonfirmasi() {
            const nama = document.getElementById('user-nama').value;
            const wa = document.getElementById('user-wa').value;
            const produk = document.getElementById('prod-name').innerText;
            if(!nama || !wa) { alert('Lengkapi Nama & WA bos!'); return; }
            
            const waLink = "https://wa.me/628385080976?text=" + encodeURIComponent(
                "KONFIRMASI PEMBAYARAN\nNama: " + nama + "\nWA: " + wa + "\nProduk: " + produk + "\n\nCek bukti transfer yang saya kirim!"
            );
            window.location.href = waLink;
        }
    </script>
</body>
</html>
