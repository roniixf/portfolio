<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEMBAYARAN - SEO DEV</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        
        /* HEADER */
        h2 { color: #ff0000; text-shadow: 0 0 15px #ff0000; text-transform: uppercase; margin-top: 10px; }
        .price { color: #fff; font-weight: bold; font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #ff0000; display: inline-block; padding-bottom: 5px; }

        /* TOMBOL MENU MERAH */
        .pay-btn {
            display: block; width: 100%; max-width: 400px; margin: 12px auto;
            padding: 16px; border-radius: 12px; border: 2px solid #ff0000; 
            font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; 
            color: #fff; text-transform: uppercase;
            background: linear-gradient(145deg, #330000, #b30000);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }
        .pay-btn:hover { box-shadow: 0 0 20px #ff0000; transform: scale(1.02); }
        .back { background: #111; border-color: #444; margin-top: 20px; font-size: 14px; text-decoration: none; }

        /* BOX KONTEN */
        .content { 
            display: none; width: 100%; max-width: 400px; margin: 20px auto; 
            padding: 20px; border: 2px solid #ff0000; border-radius: 15px; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6); background: #080808; 
            box-sizing: border-box;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* LOGO FIX */
        .logo-pay { width: 160px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; filter: drop-shadow(0 0 5px #fff); }
        .qris-img { width: 100%; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 0 15px #ff0000; }
        .acc-number { font-size: 24px; color: #ff0000; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 5px #ff0000; margin: 10px 0; }

        /* AREA UPLOAD */
        .upload-section {
            width: 100%; max-width: 400px; margin: 30px auto; 
            padding: 20px; border: 1px dashed #ff0000; border-radius: 15px;
            background: #0a0a0a; box-sizing: border-box;
        }
        .upload-section h3 { color: #ff0000; margin-top: 0; font-size: 18px; text-transform: uppercase; }
        
        input[type="text"] { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box;
        }
        input[type="file"] {
            width: 100%; background: #fff; color: #000; padding: 10px; border-radius: 8px;
            margin: 10px 0; cursor: pointer; font-weight: bold;
        }

        .btn-submit { 
            background: #ff0000; color: #fff; padding: 16px; border-radius: 50px; 
            font-weight: 900; border: none; cursor: pointer; width: 100%; 
            margin-top: 15px; text-transform: uppercase; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <h2 id="prod-name">MEMUAT...</h2>
    <div class="price" id="prod-price">Rp 0</div>

    <button class="pay-btn" onclick="showPay('qris-box')">Bayar via QRIS</button>
    <button class="pay-btn" onclick="showPay('dana-box')">Bayar via DANA</button>
    <button class="pay-btn" onclick="showPay('ovo-box')">Bayar via OVO</button>

    <div id="qris-box" class="content">
        <h3 style="color:#ff0000; margin-top:0;">SCAN QRIS</h3>
        <img src="https://takenupload.com/696782a493356" class="qris-img">
        <p>Silahkan scan kode QR di atas</p>
    </div>

    <div id="dana-box" class="content">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Logo_danain.svg/1200px-Logo_danain.svg.png" class="logo-pay" alt="DANA">
        <p>TRANSFER DANA KE:</p>
        <div class="acc-number">082245390572</div>
        <p style="font-size: 12px; color: #aaa;">Pastikan nomor sudah benar sebelum transfer</p>
    </div>

    <div id="ovo-box" class="content">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Logo_ovo_purple.svg/1200px-Logo_ovo_purple.svg.png" class="logo-pay" alt="OVO">
        <p>TRANSFER OVO KE:</p>
        <div class="acc-number">08385080976</div>
        <p style="font-size: 12px; color: #aaa;">Pastikan nomor sudah benar sebelum transfer</p>
    </div>

    <div class="upload-section">
        <h3>Upload Bukti Transfer</h3>
        <input type="text" id="user-nama" placeholder="Nama Anda">
        <input type="text" id="user-wa" placeholder="Nomor WhatsApp">
        <input type="file" id="user-file">
        <button class="btn-submit" onclick="kirimKonfirmasi()">Kirim Bukti Pembayaran</button>
    </div>

    <a href="index.html" class="pay-btn back">Kembali ke Produk</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const data = {
            '11': { n: 'TAMPILAN MPO NEW', h: 'Rp 650,000' },
            '10': { n: 'TAMPILAN KINCAI PRO', h: 'Rp 650,000' },
            '9':  { n: 'TAMPILAN NEXUS', h: 'Rp 650,000' },
            '8':  { n: 'TAMPILAN IDN GREEN', h: 'Rp 300,000' },
            '7':  { n: 'TAMPILAN PAY4D', h: 'Rp 400,000' },
            '6':  { n: 'TAMPILAN NUKE', h: 'Rp 550,000' }
        };

        if(data[id]) {
            document.getElementById('prod-name').innerText = data[id].n;
            document.getElementById('prod-price').innerText = data[id].h;
        }

        function showPay(boxId) {
            document.querySelectorAll('.content').forEach(el => el.style.display = 'none');
            document.getElementById(boxId).style.display = 'block';
            window.scrollTo({ top: document.getElementById(boxId).offsetTop - 20, behavior: 'smooth' });
        }

        function kirimKonfirmasi() {
            const nama = document.getElementById('user-nama').value;
            const wa = document.getElementById('user-wa').value;
            const produk = document.getElementById('prod-name').innerText;
            if(!nama || !wa) { alert('Nama & Nomor WA wajib diisi!'); return; }
            
            const waLink = "https://wa.me/628385080976?text=" + encodeURIComponent(
                "KONFIRMASI PEMBAYARAN\nNama: " + nama + "\nWA: " + wa + "\nProduk: " + produk + "\n\nMohon dicek bukti transfer saya."
            );
            window.location.href = waLink;
        }
    </script>
</body>
</html>
