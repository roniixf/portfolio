<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - SEO DEV PEMBAYARAN</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; padding: 20px; }
        
        h2 { color: #ff0000; text-shadow: 0 0 20px #ff0000; text-transform: uppercase; margin-top: 10px; }
        .price { color: #fff; font-weight: bold; font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid #ff0000; display: inline-block; padding-bottom: 5px; text-shadow: 0 0 10px #ff0000; }

        .pay-btn {
            display: block; width: 100%; max-width: 400px; margin: 12px auto;
            padding: 16px; border-radius: 12px; border: 2px solid #ff0000; 
            font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; 
            color: #fff; text-transform: uppercase;
            background: #000; box-shadow: 0 0 15px #ff0000;
        }
        .pay-btn:hover { box-shadow: 0 0 30px #ff0000; background: #220000; }

        .content { 
            display: none; width: 100%; max-width: 400px; margin: 20px auto; 
            padding: 20px; border: 2px solid #ff0000; border-radius: 15px; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7); background: #080808; 
            box-sizing: border-box;
        }

        /* FIX LOGO TRANSPARAN + RED GLOW SESUAI FOTO */
        .logo-pay { 
            width: 160px; height: auto; margin-bottom: 15px; 
            display: block; margin-left: auto; margin-right: auto;
            /* Menghapus background putih & bikin efek glow merah */
            filter: drop-shadow(0 0 10px #ff0000) brightness(1.2);
            mix-blend-mode: lighten;
        }

        .qris-img { width: 100%; border-radius: 10px; border: 2px solid #fff; filter: drop-shadow(0 0 10px #ff0000); margin-bottom: 15px; }
        .acc-number { font-size: 28px; color: #ff0000; font-weight: 900; text-shadow: 0 0 15px #ff0000; margin: 10px 0; }

        .upload-inside { margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ff0000; }
        
        input[type="text"] { 
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; 
            border: 1px solid #ff0000; background: #000; color: #fff; box-sizing: border-box;
        }
        input[type="file"] {
            width: 100%; background: #fff; color: #000; padding: 10px; border-radius: 8px;
            margin: 10px 0; font-weight: bold;
        }

        .btn-submit { 
            background: #ff0000; color: #fff; padding: 18px; border-radius: 50px; 
            font-weight: 900; border: none; cursor: pointer; width: 100%; 
            margin-top: 10px; text-transform: uppercase; box-shadow: 0 0 20px #ff0000;
        }

        .btn-back-red {
            display: block; width: 100%; max-width: 400px; margin: 20px auto;
            padding: 16px; border-radius: 12px; border: 2px solid #ff0000;
            background: #000; color: #fff; text-decoration: none; font-weight: 800;
            text-transform: uppercase; box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>

    <h2 id="prod-name">MEMUAT...</h2>
    <div class="price" id="prod-price">Rp 0</div>

    <button class="pay-btn" onclick="showPay('qris-box')">Bayar via QRIS</button>
    <button class="pay-btn" onclick="showPay('dana-box')">Bayar via DANA</button>
    <button class="pay-btn" onclick="showPay('ovo-box')">Bayar via OVO</button>

    <div id="qris-box" class="content">
        <h3 style="color:#ff0000; text-shadow: 0 0 10px #ff0000;">SCAN QRIS</h3>
        <img src="https://takenupload.com/696782a493356" class="qris-img">
        <div class="upload-inside">
            <input type="text" class="u-nama" placeholder="Masukan Nama Anda">
            <input type="text" class="u-wa" placeholder="Masukan Nomor WhatsApp">
            <input type="file">
            <button class="btn-submit" onclick="kirimKonfirmasi()">Kirim Bukti Pembayaran</button>
        </div>
    </div>

    <div id="dana-box" class="content">
        <img src="https://takenupload.com/696acef8317fb" class="logo-pay" alt="DANA">
        <p>TRANSFER DANA KE:</p>
        <div class="acc-number">082245390572</div>
        <div class="upload-inside">
            <input type="text" class="u-nama" placeholder="Masukan Nama Anda">
            <input type="text" class="u-wa" placeholder="Masukan Nomor WhatsApp">
            <input type="file">
            <button class="btn-submit" onclick="kirimKonfirmasi()">Kirim Bukti Pembayaran</button>
        </div>
    </div>

    <div id="ovo-box" class="content">
        <img src="https://takenupload.com/696acef23513a" class="logo-pay" alt="OVO">
        <p>TRANSFER OVO KE:</p>
        <div class="acc-number">08385080976</div>
        <div class="upload-inside">
            <input type="text" class="u-nama" placeholder="Masukan Nama Anda">
            <input type="text" class="u-wa" placeholder="Masukan Nomor WhatsApp">
            <input type="file">
            <button class="btn-submit" onclick="kirimKonfirmasi()">Kirim Bukti Pembayaran</button>
        </div>
    </div>

    <a href="index.html" class="btn-back-red">Kembali ke Produk</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const data = {
            '11': { n: 'TAMPILAN MPO NEW', h: 'Rp 650,000' },
            '10': { n: 'TAMPILAN KINCAI PRO', h: 'Rp 650,000' },
            '9':  { n: 'TAMPILAN NEXUS', h: 'Rp 650,000' },
            '8':  { n: 'TAMPILAN IDN GREEN', h: 'Rp 300,000' },
            '7':  { n: 'TAMPILAN PAY4D', h: 'Rp 400,000' },
            '6':  { n: 'TAMPILAN NUKE', h: 'Rp 550,000' }
        };

        if(data[id]) {
            document.getElementById('prod-name').innerText = data[id].n;
            document.getElementById('prod-price').innerText = data[id].h;
        }

        function showPay(boxId) {
            document.querySelectorAll('.content').forEach(el => el.style.display = 'none');
            document.getElementById(boxId).style.display = 'block';
        }

        function kirimKonfirmasi() {
            const activeBox = document.querySelector('.content[style*="display: block"]');
            const nama = activeBox.querySelector('.u-nama').value;
            const wa = activeBox.querySelector('.u-wa').value;
            if(!nama || !wa) { alert('Isi Nama & WA dulu bos!'); return; }
            const waLink = "https://wa.me/628385080976?text=" + encodeURIComponent(
                "KONFIRMASI PEMBAYARAN\nNama: " + nama + "\nWA: " + wa + "\nProduk: " + document.getElementById('prod-name').innerText
            );
            window.location.href = waLink;
        }
    </script>
</body>
</html>
