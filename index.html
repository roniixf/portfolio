<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRASTORE | Platform Game Online</title>
<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: url('https://festahoki99.shop/images.jpeg') no-repeat center center/cover;
    background-attachment: fixed;
    color: #fff;
    text-align: center;
    overflow-x: hidden;
  }

  /* --- ANIMASI HUJAN SCATTER --- */
  .snowflake {
    position: fixed; top: -10%; z-index: 9999;
    user-select: none; cursor: default;
    animation: snowflakes-fall 10s linear infinite, snowflakes-shake 3s ease-in-out infinite;
  }
  .snowflake img { width: 45px; height: 45px; filter: drop-shadow(0 0 5px #ffcc00); }
  @keyframes snowflakes-fall { 0% { top: -10% } 100% { top: 100% } }
  @keyframes snowflakes-shake { 0%,100% { transform: translateX(0) } 50% { transform: translateX(80px) } }

  .snowflake:nth-of-type(1) { left: 10%; animation-delay: 1s, 1s; }
  .snowflake:nth-of-type(2) { left: 30%; animation-delay: 6s, 0.5s; }
  .snowflake:nth-of-type(3) { left: 50%; animation-delay: 4s, 2s; }
  .snowflake:nth-of-type(4) { left: 70%; animation-delay: 2s, 2s; }
  .snowflake:nth-of-type(5) { left: 90%; animation-delay: 8s, 3s; }

  /* --- STYLE CONTENT --- */
  .welcome {
    background: rgba(0,0,0,0.8);
    width: 85%; max-width: 800px;
    margin: 25px auto; border-radius: 20px; padding: 15px;
    border: 1px solid rgba(255, 204, 0, 0.3);
    position: relative; z-index: 10;
  }

  .games {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 10px; max-width: 1000px; margin: auto;
    position: relative; z-index: 10;
  }

  .game-box {
    background: rgba(0, 0, 0, 0.85);
    border-radius: 12px; padding: 10px;
    border: 1px solid rgba(255, 204, 0, 0.2);
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .game-box img { width: 100%; border-radius: 10px; aspect-ratio: 9/16; object-fit: cover; }
  .game-box h4 { margin: 10px 0 5px; font-size: 15px; }

  .pay-method {
    display: flex; justify-content: center; gap: 4px; margin-bottom: 8px;
  }
  .pay-tag {
    background: #1a1a1a; color: #fff; font-size: 9px; 
    padding: 2px 6px; border-radius: 4px; border: 1px solid #333;
  }

  .order-btn {
    background: #ffcc00; color: #000; text-decoration: none;
    padding: 10px; border-radius: 8px; font-weight: bold;
    font-size: 13px; display: block; transition: 0.3s;
  }
  .order-btn:active { transform: scale(0.95); }

  /* --- REVIEWS --- */
  .reviews { background: rgba(0,0,0,0.85); padding: 20px 0; margin-top: 25px; overflow: hidden; }
  .review-slider { display: flex; animation: slideLeft 20s linear infinite; }
  @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  .review-box {
    background: rgba(255,255,255,0.05); padding: 12px; margin: 0 10px;
    border-radius: 10px; width: 200px; flex-shrink: 0;
  }

  .floating-icons { position: fixed; right: 15px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10000; }
  .floating-icons img { width: 45px; height: 45px; }
</style>
</head>
<body>

<div class="snowflakes" aria-hidden="true">
  <div class="snowflake"><img src="https://takenupload.com/695944008db1d"></div>
  <div class="snowflake"><img src="https://takenupload.com/695944008db1d"></div>
  <div class="snowflake"><img src="https://takenupload.com/695944008db1d"></div>
  <div class="snowflake"><img src="https://takenupload.com/695944008db1d"></div>
  <div class="snowflake"><img src="https://takenupload.com/695944008db1d"></div>
</div>

<div class="content-wrapper">
  <div class="welcome">
    <h2 style="margin: 0; font-size: 1.3rem;">Situs <span style="color: yellow;">COBRASTORE</span></h2>
    <p style="font-size: 12px; margin: 10px 0;">Terintegrasi API • Proses 1-10 Jam • Full Provider</p>
    <p style="color: orange; font-weight: bold; margin: 0;">Harga Promo Rp 1.200.000</p>
  </div>

  <div class="games" id="gamesList"></div>

  <div class="reviews">
    <div class="review-slider" id="reviewSlider"></div>
  </div>
  <p style="font-size: 11px; opacity: 0.6; padding: 15px;">© 2025 COBRASTORE Official</p>
</div>

<div class="floating-icons">
  <a href="https://wa.me/628385080976"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WA"></a>
  <a href="https://t.me/axionwl1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Tele"></a>
</div>

<script>
  const games = [
    {title:"Pay4D", price:"Rp 200.000", img:"https://festahoki99.shop/pay4d.png"},
    {title:"UG/Onix", price:"Rp 300.000", img:"https://festahoki99.shop/UG.png"},
    {title:"Nuke", price:"Rp 500.000", img:"https://festahoki99.shop/nuke.png"},
    {title:"Nexus", price:"Rp 580.000", img:"https://festahoki99.shop/nexus.png"}
  ];

  const gamesContainer = document.getElementById('gamesList');
  games.forEach(g => {
    gamesContainer.innerHTML += `
      <div class="game-box">
        <img src="${g.img}">
        <h4>${g.title}</h4>
        <p style="color:yellow; font-weight:bold; margin-bottom:8px;">${g.price}</p>
        <div class="pay-method">
           <span class="pay-tag">DANA</span>
           <span class="pay-tag">QRIS</span>
           <span class="pay-tag">BANK</span>
        </div>
        <a href="https://t.me/axionwl1" class="order-btn">Order Segera</a>
      </div>
    `;
  });

  const reviews = ["Pelayanan sangat cepat", "Admin ramah bangett", "Situs paling murah se indonesia", "Gacor parah", "Terpercaya No 1"];
  const slider = document.getElementById('reviewSlider');
  [...reviews, ...reviews].forEach(text => {
    slider.innerHTML += `
      <div class="review-box">
        <div style="color:yellow; font-size:10px;">⭐⭐⭐⭐⭐</div>
        <p style="font-size:11px; margin:5px 0 0;">${text}</p>
      </div>
    `;
  });
</script>
</body>
</html>
