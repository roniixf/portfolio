<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONI XF | Portfolio & Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }
        
        /* SIDEBAR */
        .sidebar {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            height: fit-content;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #6c63ff;
            margin-bottom: 15px;
            object-fit: cover;
        }
        
        .profile h1 {
            font-size: 24px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #6c63ff, #ff6584);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* MENU */
        .menu {
            margin-top: 30px;
        }
        
        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            padding: 15px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .menu-item:hover {
            background: rgba(108, 99, 255, 0.3);
            transform: translateX(5px);
        }
        
        .menu-item.active {
            background: linear-gradient(45deg, #6c63ff, #8a84ff);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.4);
        }
        
        /* MAIN CONTENT */
        .main-content {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .tool-section {
            display: none;
        }
        
        .tool-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .tool-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #6c63ff;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        
        button {
            background: linear-gradient(45deg, #6c63ff, #8a84ff);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        .result-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #6c63ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .mobile-menu-btn {
                display: block;
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 1000;
            }
        }
        
        .mobile-only {
            display: none;
        }
        
        @media (max-width: 768px) {
            .mobile-only {
                display: block;
            }
            .sidebar.mobile-visible {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 999;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Button -->
    <button class="mobile-only mobile-menu-btn" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i> Menu
    </button>

    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="profile">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=RoniXF" alt="RONI XF" class="profile-img">
                <h1>RONI XF</h1>
                <p>Full-Stack Developer & Security Researcher</p>
                <div class="counter">
                    <p><i class="fas fa-birthday-cake"></i> <span id="birthdayCounter">Loading...</span></p>
                </div>
            </div>
            
            <div class="menu">
                <!-- Menu akan di-generate oleh JavaScript -->
            </div>
            
            <div class="social">
                <button onclick="window.open('https://github.com', '_blank')"><i class="fab fa-github"></i> GitHub</button>
                <button onclick="window.open('https://t.me', '_blank')"><i class="fab fa-telegram"></i> Telegram</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- Tool sections akan dimuat di sini -->
        </div>
    </div>

    <script>
        // Data Menu dan Tools
        const TOOLS = [
            {

                name: 'Portfolio by RONI XF',
                icon: 'fas fa-user',
                content: `
                    <h2><i class="fas fa-user"></i> Portfolio RONI XF</h2>
                    <div class="tool-card">
                        <h3>About Me</h3>

                        <p>Experience: 3+ years in web development and security research.</p>
                        
                        <h3>Skills</h3>
                        <div class="skill-bar">
                            <p>Python <span>95%</span></p>
                            <div class="progress" style="width: 95%; background: #6c63ff;"></div>
                        </div>
                        <div class="skill-bar">
                            <p>JavaScript <span>90%</span></p>
                            <div class="progress" style="width: 90%; background: #ff6584;"></div>
                        </div>
                        <div class="skill-bar">
                            <p>Cybersecurity <span>92%</span></p>
                            <div class="progress" style="width: 92%; background: #20c997;"></div>

                `
            },
            {

                        <button onclick="lookupIP()">Lookup IP</button>

                        <button onclick="encodeHTML()">Encode HTML</button>
                        <button onclick="decodeHTML()">Decode HTML</button>
                        
                        <div class="result-box" id="htmlResult">
                            Encoded/Decoded result
                        </div>
                    </div>
                `
            },
            {
                id: 'deploy-html',
                name: 'Deploy HTML',
                icon: 'fas fa-cloud-upload-alt',
                content: `
                    <h2><i class="fas fa-cloud-upload-alt"></i> Deploy HTML Files</h2>
                    <div class="tool-card">
                        <p>Upload and deploy HTML files to GitHub Pages</p>
                        <input type="file" id="htmlFile" accept=".html,.css,.js">
                        <button onclick="deployFile()">Deploy to GitHub</button>
                        
                        <div class="result-box" id="deployResult">
                            Select an HTML file to deploy
                        </div>
                    </div>
                `
            },
            {
                id: 'web-to-apk',
                name: 'Web to APK',
                icon: 'fas fa-mobile-alt',
                content: `
                    <h2><i class="fas fa-mobile-alt"></i> Convert Website to APK</h2>
                    <div class="tool-card">
                        <input type="url" id="webUrl" placeholder="https://yourwebsite.com">
                        <input type="text" id="appName" placeholder="App Name">
                        <button onclick="generateAPK()">Generate APK</button>
                        
                        <div class="result-box" id="apkResult">

                    </div>
                `
            },
            {
                id: 'phishing-scan',
                name: 'Scan Phishing',
                icon: 'fas fa-shield-alt',
                content: `
                    <h2><i class="fas fa-shield-alt"></i> Phishing URL Scanner</h2>
                    <div class="tool-card">
                        <input type="url" id="scanUrl" placeholder="https://suspect-site.com">
                        <button onclick="scanPhishing()">Scan URL</button>
                        
                        <div class="result-box" id="scanResult">
                            Enter URL to scan for phishing
                        </div>
                    </div>
                `
            },
            {
                id: 'music-search',
                name: 'Search Lagu',
                icon: 'fas fa-music',
                content: `
                    <h2><i class="fas fa-music"></i> Music Search</h2>
                    <div class="tool-card">
                        <input type="text" id="musicInput" placeholder="Song name or artist">
                        <select id="platform">
                            <option value="youtube">YouTube</option>
                            <option value="spotify">Spotify</option>
                        </select>
                        <button onclick="searchMusic()">Search Music</button>
                        
                        <div class="result-box" id="musicResult">
                            Search results will appear here
                        </div>
                    </div>
                `
            },
            {
                id: 'chat-generator',
                name: 'iPhone Chat Generator',
                icon: 'fas fa-comment',
                content: `
                    <h2><i class="fas fa-comment"></i> iPhone Chat Generator</h2>
                    <div class="tool-card">
                        <input type="text" id="senderName" placeholder="Sender Name" value="RONI XF">
                        <input type="text" id="receiverName" placeholder="Receiver Name" value="Friend">
                        <textarea id="chatText" placeholder="Type chat message..." rows="4">Hello! How are you?</textarea>
                        <button onclick="generateChat()">Generate Chat Screenshot</button>
                        
                        <div class="result-box" id="chatResult">
                            Chat preview will appear here
                        </div>
                    </div>
                `
            },
            {
                id: 'chatbot',
                name: 'Chat Bot AI',
                icon: 'fas fa-robot',
                content: `
                    <h2><i class="fas fa-robot"></i> RONI XF AI Assistant</h2>
                    <div class="tool-card">
                        <div id="chatHistory" class="result-box" style="height: 300px; overflow-y: auto;">
                            <p><strong>AI:</strong> Hello! I'm RONI XF AI Assistant. How can I help you today?</p>
                        </div>
                        <input type="text" id="userInput" placeholder="Type your message...">
                        <button onclick="sendMessage()">Send Message</button>
                    </div>
                `
            },
            {
                id: 'encode-js',
                name: 'Encode Hard JS',
                icon: 'fas fa-file-code',
                content: `
                    <h2><i class="fas fa-file-code"></i> JavaScript Obfuscator</h2>
                    <div class="tool-card">
                        <textarea id="jsCode" placeholder="Paste JavaScript code here..." rows="6">function hello() {
    console.log("Hello RONI XF!");
}</textarea>
                        <button onclick="obfuscateJS()">Obfuscate JavaScript</button>
                        
                        <div class="result-box" id="jsResult">
                            Obfuscated code will appear here
                        </div>
                    </div>
                `
            },
            {
                id: 'tiktok-downloader',
                name: 'TikTok Downloader',
                icon: 'fas fa-video',
                content: `
                    <h2><i class="fas fa-video"></i> TikTok Video Downloader</h2>
                    <div class="tool-card">
                        <input type="url" id="tiktokUrl" placeholder="https://tiktok.com/@user/video/123456789">
                        <select id="quality">
                            <option value="hd">HD Quality</option>
                            <option value="sd">SD Quality</option>
                            <option value="audio">Audio Only</option>
                        </select>
                        <button onclick="downloadTikTok()">Download Video</button>
                        
                        <div class="result-box" id="tiktokResult">
                            Enter TikTok URL to download
                        </div>
                    </div>
                `
            }
        ];

        // JavaScript functions for all tools will continue in next file...
    </script>
</body>
</html>
