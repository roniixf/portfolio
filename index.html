<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRASTORE | Platform Game Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: #000;
    color: #fff;
    text-align: center;
    overflow-x: hidden;
  }

  /* CANVAS UTAMA UNTUK HUJAN SCATTER */
  #scatterCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1; /* Di atas background, di bawah konten */
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://festahoki99.shop/images.jpeg') no-repeat center center/cover;
    opacity: 0.3;
    z-index: 0;
  }

  /* KONTEN HARUS DI ATAS CANVAS */
  .content-wrapper {
    position: relative;
    z-index: 10;
  }

  .welcome {
    background: rgba(0,0,0,0.85);
    width: 90%;
    max-width: 850px;
    margin: 30px auto;
    border-radius: 20px;
    padding: 25px;
    border: 2px solid #ffcc00;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
  }

  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 1100px;
    margin: auto;
  }

  .game-box {
    background: rgba(17, 17, 17, 0.9);
    border-radius: 20px;
    padding: 12px;
    border: 1px solid rgba(255, 204, 0, 0.2);
  }

  .game-box img {
    width: 100%;
    height: auto;
    border-radius: 15px;
    aspect-ratio: 9/16;
    object-fit: cover;
  }

  .order-btn {
    background: linear-gradient(to bottom, #ffcc00, #ff9900);
    color: #000;
    border: none;
    padding: 12px 0;
    width: 100%;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }

  .floating-icons { position: fixed; right: 15px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; }
  .floating-icons img { width: 50px; }
</style>
</head>
<body>

<div class="bg-overlay"></div>
<canvas id="scatterCanvas"></canvas>

<div class="content-wrapper">
    <div class="welcome">
      <h2 style="color:#ffcc00; margin:0; text-shadow: 0 0 10px #ffcc00;">COBRASTORE</h2>
      <p>🔥 <b>SITUS TERINTEGRASI API - GACOR PARAH</b> 🔥</p>
      <p>Hujan Scatter Hitam Menantimu!</p>
    </div>

    <div class="games" id="gamesContainer"></div>

    <div style="margin: 50px 0; padding: 20px; background: rgba(0,0,0,0.7);">
        <h3>Copyright 2025 - COBRASTORE</h3>
    </div>
</div>

<div class="floating-icons">
  <a href="https://wa.me/628385080976"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>
  <a href="https://t.me/axionwl1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
</div>

<script>
/* DATA GAMES */
const games = [
  {title:"Pay4D", price:"Rp 2.000.000", img:"https://festahoki99.shop/pay4d.png"},
  {title:"UG/Onix", price:"Rp 2.000.000", img:"https://festahoki99.shop/UG.png"},
  {title:"Nuke", price:"Rp 2.000.000", img:"https://festahoki99.shop/nuke.png"},
  {title:"Nexus", price:"Rp 2.000.000", img:"https://festahoki99.shop/nexus.png"}
];

const gDiv = document.getElementById('gamesContainer');
games.forEach(g => {
  gDiv.innerHTML += `
    <div class="game-box">
      <img src="${g.img}">
      <h4>${g.title}</h4>
      <p style="color:#ffcc00">${g.price}</p>
      <button class="order-btn">ORDER SEGERA</button>
    </div>
  `;
});

/* SCRIPT HUJAN SCATTER HITAM (POWERFULL) */
const canvas = document.getElementById('scatterCanvas');
const ctx = canvas.getContext('2d');

let width, height;
function setCanvasSize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
setCanvasSize();
window.addEventListener('resize', setCanvasSize);

const scatters = [];
const scatterCount = 30; // Jumlah scatter yang jatuh

// Menggunakan Text "SCATTER" atau "🔥" supaya pasti muncul tanpa gambar luar
for (let i = 0; i < scatterCount; i++) {
    scatters.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 20 + 10,
        speed: Math.random() * 2 + 1,
        opacity: Math.random() * 0.5 + 0.3
    });
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    scatters.forEach(s => {
        ctx.fillStyle = `rgba(255, 204, 0, ${s.opacity})`; // Warna kuning khas scatter
        ctx.font = `bold ${s.size}px Arial`;
        ctx.fillText("SCATTER", s.x, s.y);
        
        // Tambahkan bulatan hitam di belakang teks biar sangar
        ctx.shadowBlur = 10;
        ctx.shadowColor = "black";

        s.y += s.speed;
        if (s.y > height) {
            s.y = -20;
            s.x = Math.random() * width;
        }
    });
    
    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
