<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONIXF // ELITE_HACKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & BASE */
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow-x: hidden;
        }

        /* NEON GLOW EFFECT */
        .neon-red {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 15px #ff0000;
            font-family: 'Orbitron', sans-serif;
        }

        /* PROFILE CIRCLE HUD */
        .profile-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #ff0000;
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            object-fit: cover;
            box-shadow: 0 0 20px #ff0000;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed #ff0000;
            border-radius: 50%;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* SKILL BARS */
        .skill-node {
            background: #0a0000;
            border: 1px solid #300000;
            padding: 15px;
            border-left: 4px solid #ff0000;
            margin-bottom: 15px;
        }

        .bar-bg { height: 6px; background: #222; width: 100%; margin-top: 10px; }
        .bar-fill { height: 100%; background: #ff0000; box-shadow: 0 0 10px #ff0000; }

        /* BUTTON STYLE */
        .btn-access {
            background: #ff0000;
            color: #000;
            font-weight: bold;
            padding: 12px 30px;
            display: inline-block;
            text-decoration: none;
            margin-top: 20px;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body class="p-5">

    <div class="max-w-xl mx-auto flex justify-between text-[10px] opacity-60 mb-10 tracking-widest">
        <span>[ CONNECTION: SECURE ]</span>
        <span>[ STATUS: ONLINE ]</span>
    </div>

    <div class="text-center mb-16">
        <div class="profile-wrapper mb-6">
            <div class="outer-ring"></div>
            <img src="https://via.placeholder.com/150" alt="RONIXF" class="profile-img">
        </div>
        
        <h1 class="neon-red text-5xl italic mb-2">RONIXF</h1>
        <p class="text-[10px] tracking-[0.5em] text-red-700 font-bold uppercase mb-6 underline">System Overrider</p>
        
        <div class="max-w-md mx-auto p-4 border border-red-900 bg-red-950/10 text-xs italic text-zinc-400 leading-relaxed">
            "Keamanan lo cuma ilusi. Gue nggak ngetuk pintu, gue masuk lewat celah yang bahkan lo nggak tahu itu ada."
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <div class="skill-node">
            <div class="flex justify-between text-[10px] font-bold">
                <span>PYTHON_EXPLOIT</span>
                <span class="neon-red">98%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width: 98%"></div></div>
        </div>

        <div class="skill-node">
            <div class="flex justify-between text-[10px] font-bold">
                <span>JS_GHOST_CODE</span>
                <span class="neon-red">92%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width: 92%"></div></div>
        </div>

        <div class="skill-node">
            <div class="flex justify-between text-[10px] font-bold">
                <span>PHP_SERVER_KILL</span>
                <span class="neon-red">85%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width: 85%"></div></div>
        </div>

        <div class="text-center">
            <a href="#" class="btn-access uppercase text-xs">Initialize Connection</a>
        </div>
    </div>

    <footer class="text-center mt-20 opacity-20 text-[8px] tracking-[1em] uppercase">
        Ronixf Systems // Untraceable
    </footer>

</body>
</html>
