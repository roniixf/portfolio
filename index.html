<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRASTORE | Platform Game Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: #000; /* Warna dasar hitam */
    color: #fff;
    text-align: center;
    overflow-x: hidden;
  }

  /* CANVAS UNTUK EFEK HUJAN SCATTER */
  #scatterCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Di belakang konten */
    pointer-events: none;
  }

  /* BACKGROUND IMAGE OVERLAY */
  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://festahoki99.shop/images.jpeg') no-repeat center center/cover;
    opacity: 0.4; /* Transparan agar hujan scatter terlihat */
    z-index: -2;
  }

  /* WELCOME SECTION */
  .welcome {
    background: rgba(0,0,0,0.85);
    width: 90%;
    max-width: 850px;
    margin: 30px auto;
    border-radius: 20px;
    padding: 25px;
    border: 2px solid #ffcc00;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
  }

  /* GAME GRID PORTRAIT */
  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 1100px;
    margin: auto;
  }

  @media (min-width: 768px) {
    .games { grid-template-columns: repeat(4, 1fr); }
  }

  .game-box {
    background: #111;
    border-radius: 20px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: 0.3s;
  }
  .game-box:hover { transform: scale(1.03); border-color: #ffcc00; }

  .game-box img {
    width: 100%;
    height: auto;
    border-radius: 15px;
    aspect-ratio: 9/16;
    object-fit: cover;
  }

  .order-btn {
    background: linear-gradient(to bottom, #ffcc00, #ff9900);
    color: #000;
    border: none;
    padding: 12px 0;
    width: 100%;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .reviews-section {
    background: rgba(0,0,0,0.9);
    padding: 20px 0;
    margin-top: 30px;
    overflow: hidden;
  }
  .review-slider { display: flex; width: max-content; animation: slideLeft 20s linear infinite; }
  @keyframes slideLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .review-box { background: #222; padding: 15px; margin: 0 10px; border-radius: 10px; width: 200px; text-align: left; }

  .floating-icons { position: fixed; right: 15px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; }
  .floating-icons img { width: 50px; }
</style>
</head>
<body>

<canvas id="scatterCanvas"></canvas>
<div class="bg-overlay"></div>

<div class="welcome">
  <h2 style="color:#ffcc00; margin:0;">COBRASTORE</h2>
  <p>🔥 <b>PLATFORM GAME ONLINE TERPERCAYA</b> 🔥</p>
  <p>Situs Terintegrasi API & Full Provider Game Online.</p>
</div>

<div class="games" id="gamesContainer"></div>

<div class="reviews-section">
  <div class="review-slider" id="reviewsContainer"></div>
</div>

<div class="floating-icons">
  <a href="https://wa.me/628385080976"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>
  <a href="https://t.me/axionwl1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
</div>

<script>
/* 1. DATA GAMES */
const games = [
  {title:"Pay4D", price:"Rp 2.000.000", img:"https://festahoki99.shop/pay4d.png"},
  {title:"UG/Onix", price:"Rp 2.000.000", img:"https://festahoki99.shop/UG.png"},
  {title:"Nuke", price:"Rp 2.000.000", img:"https://festahoki99.shop/nuke.png"},
  {title:"Nexus", price:"Rp 2.000.000", img:"https://festahoki99.shop/nexus.png"}
];

const gDiv = document.getElementById('gamesContainer');
games.forEach(g => {
  gDiv.innerHTML += `
    <div class="game-box">
      <img src="${g.img}">
      <h4>${g.title}</h4>
      <p style="color:#ffcc00">${g.price}</p>
      <button class="order-btn">ORDER SEGERA</button>
    </div>
  `;
});

/* 2. RENDER REVIEWS */
const reviews = ["Gacor parah! ⭐⭐⭐⭐⭐", "Admin fast respon ⭐⭐⭐⭐⭐", "Proses 5 menit ⭐⭐⭐⭐⭐", "Situs aman 100% ⭐⭐⭐⭐⭐"];
const rDiv = document.getElementById('reviewsContainer');
[...reviews, ...reviews].forEach(text => {
  rDiv.innerHTML += `<div class="review-box"><small>⭐⭐⭐⭐⭐</small><br>${text}</div>`;
});

/* 3. SCRIPT HUJAN SCATTER HITAM */
const canvas = document.getElementById('scatterCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scatters = [];
const scatterImg = new Image();
scatterImg.src = 'https://i.ibb.co/Lz9V8m6/scatter-black.png'; // Pastikan link ini aktif atau ganti ke logo scatter hitam Anda

function createScatter() {
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    size: Math.random() * 30 + 20,
    speed: Math.random() * 3 + 2,
    rotation: Math.random() * 360
  };
}

for (let i = 0; i < 20; i++) {
  scatters.push(createScatter());
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  scatters.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation * Math.PI / 180);
    // Jika gambar belum load, gambar kotak hitam sebagai cadangan
    if(scatterImg.complete) {
        ctx.drawImage(scatterImg, -s.size/2, -s.size/2, s.size, s.size);
    } else {
        ctx.fillStyle = "black";
        ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size);
    }
    ctx.restore();

    s.y += s.speed;
    s.rotation += 1;

    if (s.y > canvas.height) {
      s.y = -s.size;
      s.x = Math.random() * canvas.width;
    }
  });
  requestAnimationFrame(draw);
}

scatterImg.onload = draw;
// Untuk handle jika layar di resize
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
