<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONIIXF // CYBERCRIME</title>
    <style>
        /* RESET TOTAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Consolas', monospace;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* MATRIX BG DARAH */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.25; }

        /* NAVIGASI HAMBURGER */
        .nav-header {
            width: 100%; padding: 20px;
            display: flex; justify-content: flex-end;
            position: fixed; top: 0; z-index: 1000;
        }
        .menu-btn {
            width: 35px; height: 25px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer;
        }
        .menu-btn span {
            display: block; width: 100%; height: 3px;
            background: #f00; box-shadow: 0 0 10px #f00;
            transition: 0.4s;
        }

        /* SIDE MENU SLIDE */
        .side-menu {
            position: fixed; top: 0; right: -100%;
            width: 250px; height: 100%;
            background: rgba(10, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-left: 2px solid #f00;
            transition: 0.5s ease-in-out;
            z-index: 999;
            padding-top: 80px;
            display: flex; flex-direction: column; align-items: center;
        }
        .side-menu.active { right: 0; }
        .side-menu a {
            color: #fff; text-decoration: none; font-size: 18px;
            margin: 15px 0; letter-spacing: 3px;
            transition: 0.3s; text-transform: uppercase;
        }
        .side-menu a:hover { color: #f00; text-shadow: 0 0 10px #f00; }

        /* PROFILE NEON (HD) */
        .profile-container {
            position: relative; width: 200px; height: 200px;
            margin-top: 80px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .profile-img {
            width: 150px; height: 150px; border-radius: 50%;
            border: 3px solid #f00; box-shadow: 0 0 35px #f00;
            z-index: 10; object-fit: cover;
        }
        .radar {
            position: absolute; width: 100%; height: 100%;
            border: 2px solid transparent; border-top: 3px solid #f00;
            border-radius: 50%; animation: rotate 2s linear infinite;
        }
        @keyframes rotate { from {transform: rotate(0deg)} to {transform: rotate(360deg)} }

        /* TYPOGRAPHY */
        .title {
            font-size: 24px; color: #f00; font-weight: 900;
            text-shadow: 0 0 15px #f00; letter-spacing: 5px;
            text-align: center; margin-bottom: 30px;
        }

        /* CARD NYINDIR (DINGIN) */
        .card {
            width: 90%; max-width: 450px;
            background: rgba(20, 0, 0, 0.8);
            border: 1px solid #f00; padding: 20px;
            margin-bottom: 30px; position: relative;
            box-shadow: inset 0 0 15px rgba(255,0,0,0.2);
        }
        .card-header {
            position: absolute; top: -10px; left: 15px;
            background: #f00; color: #000; font-size: 10px;
            padding: 2px 8px; font-weight: bold;
        }
        .quote { font-size: 14px; font-style: italic; color: #ddd; line-height: 1.6; }

        /* SKILL BARS */
        .skill-box { width: 90%; max-width: 450px; }
        .skill-info { font-size: 11px; color: #f00; margin-bottom: 5px; font-weight: bold; display: flex; justify-content: space-between; }
        .bar-bg { width: 100%; height: 8px; background: #111; border: 1px solid #300; margin-bottom: 20px; }
        .bar-fill { height: 100%; background: #f00; box-shadow: 0 0 15px #f00; transition: 1s; }

        footer { padding: 50px; color: #300; font-size: 9px; letter-spacing: 10px; text-align: center; }
    </style>
</head>
<body>

<canvas id="m"></canvas>

<div class="nav-header">
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="side-menu" id="sideMenu">
    <a href="#">// HOME</a>
    <a href="#">// DATABASE</a>
    <a href="#">// LOG_WIPER</a>
    <a href="#">// TERMINATE</a>
</div>

<div class="profile-container">
    <div class="radar"></div>
    <img src="https://takenupload.com/69672d9dd452e" class="profile-img" alt="RONIIXF">
</div>

<h1 class="title">RONIIXF // CYBERCRIME</h1>

<div class="card">
    <div class="card-header">UNAUTHORIZED_ACCESS</div>
    <p class="quote">
        "Gue gak ngetuk pintu mainframe lo, gue bakar seluruh gedungnya lewat satu baris kode. Keamanan lo cuma pajangan buat gue hancurin."
    </p>
</div>

<div class="skill-box">
    <div class="skill-info"><span>KERNEL_PENETRATION</span><span>99%</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width: 99%"></div></div>
    
    <div class="skill-info"><span>SHADOW_INJECTION</span><span>95%</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width: 95%"></div></div>
</div>

<footer>EST 2026 // SILENCE IS DEADLY</footer>

<script>
    // MATRIX
    const c = document.getElementById('m');
    const ctx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const txt = "0101";
    const drops = Array(Math.floor(c.width/16)).fill(1);
    function d() {
        ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle = "#f00"; ctx.font = "16px monospace";
        drops.forEach((y, i) => {
            ctx.fillText(txt[Math.floor(Math.random()*txt.length)], i*16, y*16);
            if(y*16 > c.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(d, 40);

    // TOGGLE MENU
    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
    }
</script>

</body>
</html>
