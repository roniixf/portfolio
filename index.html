<script>
    const audio = document.getElementById('mainAudio');
    const audioSrc = document.getElementById('audioSrc');
    const statusText = document.getElementById('status');

    function changeMusic(url, el) {
        // Hapus class active dari semua tombol
        document.querySelectorAll('.track-item').forEach(item => item.classList.remove('active'));
        
        // Pasang musik & play
        audioSrc.src = url;
        audio.load();
        audio.play();
        
        // Tandai tombol active
        el.classList.add('active');
        statusText.innerText = "Playing: " + el.innerText;
        statusText.style.color = "#ff0000";
    }

    // Script Notif Otomatis
    const fakeUsers = ["Rafi", "Sultan", "Bambang", "Rizki", "Andre"];

    function showNotif() {
        const u = fakeUsers[Math.floor(Math.random()*fakeUsers.length)];
        const p = fakeProds[Math.floor(Math.random()*fakeProds.length)];
        const pop = document.getElementById('popup');
        pop.innerHTML = `🔔 <b>${u}</b> baru saja order <b>${p}</b>`;
        pop.classList.add('show');

    setInterval(showNotif, 12000);
