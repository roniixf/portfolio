<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRASTORE | Platform Game Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; padding: 0;
    font-family: "Poppins", sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* CANVAS HUJAN SCATTER */
  #scatterCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1; /* Di bawah konten, di atas BG */
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://festahoki99.shop/images.jpeg') no-repeat center center/cover;
    opacity: 0.3;
    z-index: 0;
  }

  .content-wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
  }

  /* STYLE KARTU GAME SEPERTI DI FOTO */
  .welcome {
    background: rgba(0,0,0,0.85);
    width: 90%;
    max-width: 800px;
    margin: 30px auto;
    border-radius: 20px;
    padding: 20px;
    border: 1px solid #ffcc00;
  }

  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 1100px;
    margin: auto;
  }

  .game-box {
    background: #111;
    border-radius: 15px;
    padding: 10px;
    border: 1px solid rgba(255, 204, 0, 0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .game-box img {
    width: 100%;
    border-radius: 10px;
    aspect-ratio: 9/16;
    object-fit: cover;
    display: block;
  }

  .game-box h4 { margin: 10px 0 2px; font-size: 16px; }
  .game-box p { margin: 0 0 10px; color: #ffcc00; font-weight: bold; }

  .order-btn {
    background: #ffcc00;
    color: #000;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
  }

  .floating-icons { position: fixed; right: 15px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .floating-icons img { width: 45px; height: 45px; }
</style>
</head>
<body>

<div class="bg-overlay"></div>
<canvas id="scatterCanvas"></canvas>

<div class="content-wrapper">
  <div class="welcome">
    <h2 style="color:#ffcc00; margin:0;">COBRASTORE</h2>
    <p style="font-size: 12px; margin-top: 5px;">🔥 SITUS TERINTEGRASI API - BLACK SCATTER MODE 🔥</p>
  </div>

  <div class="games" id="gamesContainer"></div>
  
  <p style="margin: 40px 0; font-size: 12px; opacity: 0.6;">Copyright 2025 - COBRASTORE</p>
</div>

<div class="floating-icons">
  <a href="https://wa.me/628385080976"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>
  <a href="https://t.me/axionwl1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
</div>

<script>
/* DATA GAMES (FIXED RENDER) */
const games = [
  {title:"Pay4D", price:"Rp 2.000.000", img:"https://festahoki99.shop/pay4d.png"},
  {title:"UG/Onix", price:"Rp 2.000.000", img:"https://festahoki99.shop/UG.png"},
  {title:"Nuke", price:"Rp 2.000.000", img:"https://festahoki99.shop/nuke.png"},
  {title:"Nexus", price:"Rp 2.000.000", img:"https://festahoki99.shop/nexus.png"}
];

const container = document.getElementById('gamesContainer');
games.forEach(g => {
  container.innerHTML += `
    <div class="game-box">
      <img src="${g.img}">
      <h4>${g.title}</h4>
      <p>${g.price}</p>
      <button class="order-btn">Order Segera</button>
    </div>
  `;
});

/* SCRIPT HUJAN SCATTER HITAM PERSIS FOTO */
const canvas = document.getElementById('scatterCanvas');
const ctx = canvas.getContext('2d');

let w, h;
function init() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
init();
window.onresize = init;

const dots = [];
for (let i = 0; i < 25; i++) {
  dots.push({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 20 + 15, // Ukuran Scatter
    s: Math.random() * 2 + 1,    // Kecepatan Jatuh
    a: Math.random() * 0.5 + 0.2 // Transparansi
  });
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  dots.forEach(d => {
    // 1. Gambar Lingkaran Hitam (Body Scatter)
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 0, 0, ${d.a})`;
    ctx.fill();
    
    // 2. Garis Pinggir (Glow Emas)
    ctx.strokeStyle = `rgba(255, 204, 0, ${d.a})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3. Tulisan "SCATTER" Merah di Tengah
    ctx.fillStyle = `rgba(255, 0, 0, ${d.a})`;
    ctx.font = `bold ${d.r * 0.4}px Arial`;
    ctx.textAlign = "center";
    ctx.fillText("SCATTER", d.x, d.y + (d.r * 0.15));

    d.y += d.s;
    if (d.y > h + 50) {
      d.y = -50;
      d.x = Math.random() * w;
    }
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
