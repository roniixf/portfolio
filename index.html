<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRASTORE | Platform Game Online</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* CANVAS UNTUK HUJAN SCATTER HITAM */
  #scatterCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1; /* Di depan background, di belakang konten */
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://festahoki99.shop/images.jpeg') no-repeat center center/cover;
    opacity: 0.35;
    z-index: 0;
  }

  .content-wrapper {
    position: relative;
    z-index: 10;
    text-align: center;
  }

  .welcome {
    background: rgba(0,0,0,0.8);
    width: 90%;
    max-width: 800px;
    margin: 40px auto;
    border-radius: 20px;
    padding: 25px;
    border: 1px solid #ffcc00;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
  }

  .games {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
    max-width: 1100px;
    margin: auto;
  }

  .game-box {
    background: #0f0f0f;
    border-radius: 15px;
    padding: 12px;
    border: 1px solid rgba(255, 204, 0, 0.1);
    transition: 0.3s;
  }

  .game-box img {
    width: 100%;
    border-radius: 12px;
    aspect-ratio: 9/16;
    object-fit: cover;
  }

  .order-btn {
    background: #ffcc00;
    color: #000;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }

  .floating-icons { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 100; }
  .floating-icons img { width: 50px; height: 50px; }
</style>
</head>
<body>

<div class="bg-overlay"></div>
<canvas id="scatterCanvas"></canvas>

<div class="content-wrapper">
  <div class="welcome">
    <h1 style="color:#ffcc00; margin:0;">COBRASTORE</h1>
    <p>🔥 <b>SITUS TERINTEGRASI API - GACOR TERUS</b> 🔥</p>
    <p>Nikmati sensasi hujan scatter hitam premium.</p>
  </div>

  <div class="games" id="gamesContainer"></div>

  <div style="margin: 60px 0 20px;">
    <p>Copyright 2025 - COBRASTORE</p>
  </div>
</div>

<div class="floating-icons">
  <a href="https://wa.me/628385080976"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>
  <a href="https://t.me/axionwl1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a>
</div>

<script>
/* DATA GAMES */
const games = [
  {title:"Pay4D", price:"Rp 2.000.000", img:"https://festahoki99.shop/pay4d.png"},
  {title:"UG/Onix", price:"Rp 2.000.000", img:"https://festahoki99.shop/UG.png"},
  {title:"Nuke", price:"Rp 2.000.000", img:"https://festahoki99.shop/nuke.png"},
  {title:"Nexus", price:"Rp 2.000.000", img:"https://festahoki99.shop/nexus.png"}
];

const gContainer = document.getElementById('gamesContainer');
games.forEach(g => {
  gContainer.innerHTML += `
    <div class="game-box">
      <img src="${g.img}">
      <h4 style="margin:10px 0 5px">${g.title}</h4>
      <p style="color:#ffcc00; margin:0 0 10px">${g.price}</p>
      <button class="order-btn">ORDER SEGERA</button>
    </div>
  `;
});

/* SISTEM HUJAN SCATTER HITAM PREMIUM */
const canvas = document.getElementById('scatterCanvas');
const ctx = canvas.getContext('2d');

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

const particles = [];
const particleCount = 40;

for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    size: Math.random() * 15 + 10,
    speed: Math.random() * 2 + 0.5,
    opacity: Math.random() * 0.4 + 0.1
  });
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => {
    // Membuat bentuk Scatter Hitam (Bulat Gelap dengan Aura Emas)
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(10, 10, 10, ${p.opacity})`; // Hitam pekat transparan
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 204, 0, ${p.opacity})`; // Pinggiran emas tipis
    ctx.lineWidth = 1;
    ctx.stroke();

    // Teks di tengah scatter (Opsional, biar makin jelas itu scatter)
    ctx.fillStyle = `rgba(255, 204, 0, ${p.opacity})`;
    ctx.font = `bold ${p.size * 0.6}px Arial`;
    ctx.textAlign = "center";
    ctx.fillText("S", p.x, p.y + (p.size * 0.2));

    p.y += p.speed;
    if (p.y > h) {
      p.y = -20;
      p.x = Math.random() * w;
    }
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
